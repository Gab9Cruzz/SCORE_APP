[pytest]
asyncio_mode = auto
# Los fixtures de tests/conftest.py (engine, _test_db_ready) son scope=session
# y mantienen conexiones asyncpg vivas entre tests. Sin esto, pytest-asyncio
# les da un event loop por test y las conexiones quedan "atadas" a un loop
# que ya cerró: cada query después del primer test falla con un error de
# evento loop que exceptions/handlers.py termina mostrando como 400 genérico.
asyncio_default_fixture_loop_scope = session
asyncio_default_test_loop_scope = session

# A2 (docs/plans/cierre-pendientes-todos-plan.md): marca los tests que usan
# `sesiones_paralelas` (dos conexiones DB reales, contra su propia base) —
# más lentos y no herméticos del mismo modo que el resto, así que
# verificar.ps1 los corre aparte por default (switch -Concurrencia).
# --strict-markers: sin esto, un typo en `-m "not concurenica"` no
# deselecciona nada y reporta verde — el escape hatch que promete el
# marker no sería alcanzable. Verificado antes de agregarlo: `pytest
# --collect-only -W error::pytest.PytestUnknownMarkWarning` corre limpio
# sobre los 526 tests existentes (ninguno usaba un marker no registrado).
markers =
    concurrencia: usa sesiones_paralelas (2 conexiones DB reales) — no corre en pytest -q por default.
addopts = --strict-markers
