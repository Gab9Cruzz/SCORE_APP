# DX-2 (docs/plans/cierre-pendientes-todos-plan.md): "postgres" es un
# servicio del compose, no un supuesto de que ya lo tenés instalado en el
# host con torneos_mvp cargado — esa suposición era justo lo que rompía a
# la segunda persona que clonaba el repo. El volumen `../database` se monta
# como `docker-entrypoint-initdb.d`: la imagen oficial de Postgres corre
# TODOS los .sql ahí adentro, en orden alfabético, en la PRIMERA inicialización
# (volumen de datos vacío) — como los archivos van 01_.. 33_.. zero-padded,
# alfabético == numérico, y eso carga el esquema completo (no solo
# 01_schema.sql–06_triggers.sql: la API real necesita las migraciones 07-33
# para funcionar — RBAC/licencias, catálogo de disciplinas, portal público,
# etc. — así que este compose carga TODO, a diferencia del harness de tests
# de backend/tests/conftest.py, que a propósito se queda en 01-06 porque
# solo necesita el baseline).
#
# Alternativa "Postgres en el host" sigue funcionando: comentá el servicio
# `postgres` de abajo y volvé a `host.docker.internal` en `DATABASE_URL`.
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: 1234
      POSTGRES_DB: torneos_mvp
    ports:
      - "5432:5432"
    volumes:
      - ../database:/docker-entrypoint-initdb.d:ro
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 2s
      timeout: 3s
      retries: 30
    restart: unless-stopped

  api:
    build:
      context: ../backend
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+psycopg://postgres:1234@postgres:5432/torneos_mvp
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:?Falta JWT_SECRET_KEY. Generá uno con: python -c "import secrets; print(secrets.token_hex(32))" y exportalo antes de levantar el compose (ver README de esta carpeta)}
      JWT_ALGORITHM: HS256
      JWT_EXPIRE_MINUTES: "120"
      ADMIN_USERNAME: ${ADMIN_USERNAME:-admin}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-admin1234}
      ADMIN_NOMBRE: Administrador
      CORS_ORIGINS: "*"
      API_V1_PREFIX: /api/v1
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped

volumes:
  postgres-data:
