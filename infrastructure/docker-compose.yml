# DX-2 (docs/plans/cierre-pendientes-todos-plan.md): "postgres" es un
# servicio del compose, no un supuesto de que ya lo tenés instalado en el
# host con torneos_mvp cargado.
#
# TASK-006 (OPS-01): en la primera inicialización (volumen de datos vacío)
# la imagen corre initdb/00_init.sh, que carga 01–06 (el esquema final) y
# 11 (catálogo de disciplinas) desde /database. Las migraciones 07+ NO se
# corren: son historia ya incorporada a 01–06, y montar database/ entera
# como docker-entrypoint-initdb.d abortaba la inicialización en la 08.
# Los datos de demostración son opcionales: ver README de esta carpeta.
#
# Alternativa "Postgres en el host" sigue funcionando: comentá el servicio
# `postgres` de abajo y volvé a `host.docker.internal` en `DATABASE_URL`.
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: 1234
      POSTGRES_DB: torneos_mvp
    ports:
      - "5432:5432"
    volumes:
      - ../database:/database:ro
      - ./initdb:/docker-entrypoint-initdb.d:ro
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 2s
      timeout: 3s
      retries: 30
    restart: unless-stopped

  api:
    build:
      context: ../backend
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+psycopg://postgres:1234@postgres:5432/torneos_mvp
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:?Falta JWT_SECRET_KEY. Generá uno con: python -c "import secrets; print(secrets.token_hex(32))" y exportalo antes de levantar el compose (ver README de esta carpeta)}
      JWT_ALGORITHM: HS256
      JWT_EXPIRE_MINUTES: "120"
      ADMIN_USERNAME: ${ADMIN_USERNAME:-admin}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?Falta ADMIN_PASSWORD. Elegí la clave del primer usuario Admin y exportala antes de levantar el compose (ver README de esta carpeta)}
      ADMIN_NOMBRE: Administrador
      CORS_ORIGINS: ${CORS_ORIGINS:-*}
      # TASK-005: con ENTORNO=produccion la API no arranca con secretos de
      # ejemplo ni con CORS_ORIGINS="*".
      ENTORNO: ${ENTORNO:-desarrollo}
      API_V1_PREFIX: /api/v1
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped

volumes:
  postgres-data:
